<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>re0 全新改版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one full-height home per direction (top bar, centred stats + one merged box + intent card, background wall); the review chrome is a separate dark strip.
   Three directions, each a complete token set scoped to its own root class. One look per direction rather than following the viewer's theme:
   direction B carries its own dark/light switch. */
:root {
  --chrome: #16181d; --chrome-2: #1f2229; --chrome-line: #2d313a; --chrome-text: #b9bec9;
  --page: #f5f5f3; --page-ink: #17191d; --page-mut: #60646d; --page-line: #e1e1dc;
  --ui: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--page); color: var(--page-ink); }
body { font-family: var(--ui); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
textarea, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
:focus-visible { outline: 3px solid #7aa7ff; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- review chrome ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--chrome); }
.rc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--chrome); color: var(--chrome-text); font-size: 12px; }
.rc-row { display: flex; align-items: center; gap: 6px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; scrollbar-width: none; }
.rc-row::-webkit-scrollbar { display: none; }
.rc-row + .rc-row { background: var(--chrome-2); border-top: 1px solid var(--chrome-line); padding-block: 6px; }
.rc-brand { color: #fff; font-weight: 650; white-space: nowrap; margin-right: 10px; display: inline-flex; gap: 8px; align-items: center; }
.rc-brand small { font: 9px "JetBrains Mono", monospace; letter-spacing: .1em; color: #8a909c; border: 1px solid var(--chrome-line); border-radius: 4px; padding: 1px 5px; }
.rc-tab, .rc-state { white-space: nowrap; border-radius: 6px; padding: 4px 10px; display: inline-flex; gap: 5px; align-items: center; }
.rc-tab:hover, .rc-state:hover { background: #2a2e37; color: #fff; }
.rc-tab[aria-current="page"] { background: #fff; color: #111; font-weight: 600; }
.rc-state[aria-pressed="true"] { background: #3a3f4b; color: #fff; }
.rc-label { font: 9px "JetBrains Mono", monospace; letter-spacing: .12em; color: #6f7581; margin-right: 4px; white-space: nowrap; }
.rc-sep { width: 1px; height: 16px; background: var(--chrome-line); margin: 0 6px; flex: none; }
.rc-note { margin-left: auto; padding-left: 12px; color: #8a909c; white-space: nowrap; }
@media (max-width: 760px) { .rc-note { display: none; } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: #16181d; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px); }

/* ---------- shared home skeleton ---------- */
.h { position: relative; min-height: calc(100vh - var(--rc-h, 84px)); overflow: hidden; display: flex; flex-direction: column; isolation: isolate; }
.wall { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.veil { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.h-top { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.h-top .sp { flex: 1; }
.h-top .lk { padding: 6px 9px; font-size: 14px; }
.h-mid { position: relative; z-index: 2; flex: 1; display: flex; align-items: center; justify-content: center; padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.h-in { position: relative; width: min(720px, 100%); display: grid; gap: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.st { display: grid; gap: 2px; min-width: 0; }
.st .n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.lede { text-align: center; text-wrap: balance; }
.box { position: relative; }
.box-row { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px 4px; }
.box-row > svg.i { width: 20px; height: 20px; margin-top: 5px; }
.box-row textarea { flex: 1; min-width: 0; border: 0; outline: none; resize: none; background: transparent; font-size: 17px; line-height: 1.5; min-height: 54px; max-height: 200px; field-sizing: content; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 12px 12px 18px; }
.bar .sp { flex: 1; }
.intent { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.intent svg.i { width: 14px; height: 14px; }
.hint { font-size: 12.5px; }
.go { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.go:disabled { opacity: .45; cursor: not-allowed; }
.drop .sec { display: flex; justify-content: space-between; padding: 12px 18px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.m { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 8px 18px; font-size: 13.5px; }
.m b { font-weight: 700; display: block; }
.m small { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 10px 18px 16px; }
.act { display: grid; gap: 2px; text-align: left; padding: 11px 13px; font-size: 13.5px; transition: transform .15s; }
.act b { display: flex; gap: 7px; align-items: center; font-weight: 700; }
.act small { font-size: 12px; }
/* the suggestion card under the box */
.sug { display: grid; gap: 12px; padding: 16px 18px; animation: pop .28s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }
.sug-h { display: flex; gap: 12px; align-items: flex-start; }
.sug-ic { width: 38px; height: 38px; flex: none; display: grid; place-items: center; }
.sug-ic svg.i { width: 20px; height: 20px; }
.sug-h b { display: block; font-size: 16px; font-weight: 800; line-height: 1.35; }
.sug-h p { font-size: 13.5px; margin-top: 2px; }
.sug-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.sug-meta .v { font-weight: 800; font-variant-numeric: tabular-nums; }
.sug-meta .pill { display: inline-flex; gap: 4px; align-items: center; }
.sug-acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sug-acts .fine { font-size: 12px; margin-left: auto; }
.related { font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.related a { text-decoration: underline; text-underline-offset: 3px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt { display: grid; gap: 6px; text-align: left; padding: 14px 16px; font-size: 13px; animation: pop .28s cubic-bezier(.2,.9,.3,1.3) both; transition: transform .15s; }
.opt:nth-child(2) { animation-delay: .06s; }
.opt b { display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 800; }
.opt b svg.i { width: 18px; height: 18px; }
.opt .go-l { font-weight: 800; display: inline-flex; gap: 5px; align-items: center; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; font-size: 13px; transition: transform .18s; }
.chip:hover { transform: translateY(-2px) rotate(-1deg); }
.chip svg.i { width: 14px; height: 14px; }
.h-foot { position: relative; z-index: 2; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; width: fit-content; max-width: calc(100% - 32px); margin: 0 auto 16px; padding: 6px 16px; font-size: 12px; }
.h-foot button { display: inline-flex; gap: 5px; align-items: center; }
.h-foot svg.i { width: 13px; height: 13px; }
.h.paused * { animation-play-state: paused !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 760px) {
  .h-top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 6px; }
  .h-top .wide { display: none; }
  .h-mid { align-items: flex-start; padding-top: 20px; }
  .stats { gap: 8px; }
  .box-row textarea { font-size: 16px; }
  .acts, .two { grid-template-columns: 1fr; }
  .bar { padding-left: 14px; }
  .sug-acts .fine { margin-left: 0; flex-basis: 100%; }
}

/* =====================================================================
   A · 气泡 Chat — a group chat of questions and cited answers; airy white, soft colour blobs, round type, coral for the action.
   ===================================================================== */
.dA { --bg: #f7f8fc; --card: #ffffff; --ink: #20223a; --mut: #676b84; --faint: #a5a9bd; --ln: #e6e8f2; --cor: #ff5a3c; --cor-6: #d63c1f; --cor-d: #b8321a; --cor-s: #fff0ec;
  --ok: #12b886; --ok-bg: #dcf8ec; --ok-tx: #0b7f5c; --warn: #f5a623; --warn-bg: #fff4d6; --warn-tx: #8a5a00; --err: #e5484d; --err-bg: #ffecec; --err-tx: #b4232a; --info: #3b8cff; --info-bg: #e6f0ff; --info-tx: #1f5fcc;
  --sh-sm: 0 2px 8px rgba(32,34,58,.08); --sh-md: 0 8px 24px rgba(32,34,58,.07); --sh-lg: 0 18px 50px rgba(32,34,58,.12); --sh-cor: 0 6px 16px rgba(214,60,31,.28);
  --b1: #c9f7e4; --b2: #d6ebff; --b3: #ffe0ec; --b4: #fff0bf; --c1: #12b886; --c2: #3b8cff; --c3: #ff5c93; --c4: #f5a623; --c5: #8b6cff; --c6: #10b4c8;
  --round: Nunito, "PingFang SC", sans-serif;
  background: var(--bg); color: var(--ink); font-family: var(--round); }
.dA .wall::before { content: ""; position: absolute; inset: -10%; background:
  radial-gradient(28% 32% at 12% 22%, var(--b1), transparent 70%), radial-gradient(26% 30% at 88% 18%, var(--b3), transparent 70%),
  radial-gradient(30% 34% at 82% 84%, var(--b2), transparent 70%), radial-gradient(26% 30% at 16% 86%, var(--b4), transparent 70%); animation: blobs 30s ease-in-out infinite alternate; }
@keyframes blobs { to { transform: translate(2%, -2%) rotate(3deg); } }
.dA .veil { background: radial-gradient(ellipse 54% 64% at 50% 50%, rgba(247,248,252,.98) 0%, rgba(247,248,252,.93) 52%, rgba(247,248,252,.55) 80%, rgba(247,248,252,.15) 100%); }
.dA .wall-in { opacity: .6; }
.dA .h-top { background: rgba(247,248,252,.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.dA .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 900; font-size: 22px; letter-spacing: -.5px; }
.dA .brand .bub { width: 30px; height: 26px; border-radius: 12px 12px 12px 4px; background: var(--cor); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 900; transition: transform .2s; }
.dA .brand:hover .bub { transform: rotate(-8deg) scale(1.08); }
.dA .lk { font-weight: 700; color: var(--mut); }
.dA .lk:hover { color: var(--ink); }
.dA .b1 { background: var(--cor-6); color: #fff; border-radius: 999px; padding: 7px 16px; font-weight: 800; box-shadow: var(--sh-cor); transition: transform .15s; }
.dA .b2 { background: var(--card); border-radius: 999px; padding: 7px 16px; font-weight: 800; box-shadow: 0 2px 8px rgba(32,34,58,.08); transition: transform .15s; }
.dA .b1:hover, .dA .b2:hover { transform: translateY(-2px); }
.dA .ib { width: 38px; height: 38px; display: grid; place-items: center; background: var(--card); border-radius: 50%; position: relative; box-shadow: 0 2px 8px rgba(32,34,58,.08); }
.dA .ib .dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--cor); border: 2px solid #fff; }
.dA .ib .cnt { position: absolute; top: -4px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--cor); color: #fff; font: 800 10.5px/14px var(--round); text-align: center; padding: 0 4px; border: 2px solid #fff; }
.dA .me { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; font-weight: 900; font-size: 13px; }
.dA .st { background: var(--card); border-radius: 22px; padding: 12px 16px 13px; box-shadow: 0 8px 24px rgba(32,34,58,.07); position: relative; transition: transform .2s; }
.dA .st:hover { transform: translateY(-3px); }
.dA .st::after { content: ""; position: absolute; left: 22px; bottom: -7px; width: 16px; height: 16px; background: var(--card); transform: rotate(45deg); border-radius: 3px; }
.dA .st .n { font-weight: 900; font-size: 36px; line-height: 1.05; letter-spacing: -1px; }
.dA .st .l { font-weight: 700; font-size: 13px; color: var(--mut); display: inline-flex; gap: 6px; align-items: center; }
.dA .st .l::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.dA .st.off { --c: var(--c1); } .dA .st.sh { --c: var(--c2); } .dA .st.total { --c: var(--cor); }
.dA .st.total .n { color: var(--cor); }
.dA .lede { font-weight: 800; font-size: 20px; margin-top: 4px; }
.dA .lede em { font-style: normal; background: linear-gradient(transparent 60%, var(--b4) 60%); padding: 0 2px; }
.dA .box { background: var(--card); border-radius: 28px; box-shadow: 0 18px 50px rgba(32,34,58,.12); border: 2px solid transparent; transition: border-color .15s, box-shadow .15s; }
.dA .box:focus-within { border-color: #ffc2b4; box-shadow: 0 0 0 6px rgba(255,90,60,.12), 0 18px 50px rgba(32,34,58,.12); }
.dA .box-row > svg.i { color: var(--cor); }
.dA .box-row textarea { font-family: var(--round); font-weight: 700; font-size: 18px; }
.dA .box-row textarea::placeholder { color: #a5a9bd; font-weight: 600; }
.dA .intent { color: var(--mut); font-weight: 700; background: var(--bg); border-radius: 999px; padding: 4px 10px; }
.dA .intent.cmd { color: var(--cor-d); background: var(--cor-s); }
.dA .intent.unk { color: var(--warn-tx); background: var(--warn-bg); }
.dA .hint { color: var(--mut); font-weight: 600; }
.dA .go { background: var(--cor-6); color: #fff; padding: 9px 18px; border-radius: 999px; font-weight: 900; box-shadow: var(--sh-cor); transition: transform .15s; }
.dA .go:not(:disabled):hover, .dA .b1:hover, .dA .bt1:hover { background: var(--cor-d); transform: translateY(-1px); }
.dA .drop { border-top: 1px solid var(--ln); }
.dA .drop .sec { color: var(--mut); font-weight: 800; }
.dA .m small { color: var(--mut); }
.dA .tagx { font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 1px 9px; background: var(--bg); color: var(--mut); }
.dA .tagx.off { background: var(--ok-bg); color: var(--ok-tx); }
.dA .act { background: var(--bg); border-radius: 18px; }
.dA .act small { color: var(--mut); }
.dA .act.p { background: var(--ink); color: #fff; }
.dA .act.p small { color: #c3c6d8; }
.dA .act:hover { transform: translateY(-1px); }
.dA .sug, .dA .opt { background: var(--card); border-radius: 24px; box-shadow: 0 14px 40px rgba(32,34,58,.12); }
.dA .sug-ic { border-radius: 14px 14px 14px 4px; background: var(--cor-s); color: var(--cor); }
.dA .sug p, .dA .fine, .dA .related { color: var(--mut); }
.dA .sug-meta .pill { background: var(--bg); border-radius: 999px; padding: 3px 10px; font-weight: 700; white-space: nowrap; }
.dA .sug-meta .free { background: var(--ok-bg); color: var(--ok-tx); }
.dA .bt1 { background: var(--cor-6); color: #fff; border-radius: 999px; padding: 9px 18px; font-weight: 900; display: inline-flex; gap: 6px; align-items: center; box-shadow: var(--sh-cor); transition: transform .15s; }
.dA .bt2 { transition: transform .15s; }
.dA .bt2:hover { transform: translateY(-1px); background: #eef0f7; }
.dA .back { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; font-weight: 800; color: var(--cor-6); justify-self: start; }
.dA .sug .m { padding: 6px 0; }
.dA .sug .rees { display: grid; gap: 2px; border-top: 1px solid var(--ln); border-bottom: 1px solid var(--ln); padding: 4px 0; }
.dA .bt2 { background: var(--bg); border-radius: 999px; padding: 9px 16px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; }
.dA .opt b svg.i { color: var(--cor); }
.dA .opt .go-l { color: var(--cor-6); }
.dA .opt span { color: var(--mut); }
.dA .opt:hover { transform: translateY(-2px); }
.dA .chip { background: var(--card); border-radius: 999px; font-weight: 700; box-shadow: 0 3px 10px rgba(32,34,58,.07); }
.dA .chip.do svg.i { color: var(--cor); }
.dA .h-foot { background: rgba(255,255,255,.85); border-radius: 999px; color: var(--mut); font-weight: 700; }
.dA .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 900; font-size: 11.5px; flex: none; }
/* wall: columns of question + cited answer pairs, drifting up like a chat */
.dA .wall-in { position: absolute; inset: -40px -30px; display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 18px; }
.dA .col { display: flex; flex-direction: column; gap: 18px; animation: up var(--dur, 120s) linear infinite; }
@keyframes up { from { transform: translateY(0); } to { transform: translateY(-50%); } }
@keyframes down { from { transform: translateY(-50%); } to { transform: translateY(0); } }
.dA .pair { display: grid; gap: 6px; }
.dA .qb { justify-self: end; max-width: 88%; background: var(--ink); color: #fff; border-radius: 16px 16px 4px 16px; padding: 7px 11px; font-size: 12px; font-weight: 700; }
.dA .ab { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 7px; align-items: end; }
.dA .ab .av { width: 26px; height: 26px; font-size: 9px; }
.dA .ab > div { background: var(--card); border-radius: 16px 16px 16px 4px; padding: 8px 11px; font-size: 11.5px; box-shadow: 0 4px 12px rgba(32,34,58,.06); }
.dA .ab b { display: block; font-size: 11px; color: var(--c); font-weight: 900; }
.dA .ab .src { display: inline-flex; margin-top: 5px; font-size: 10px; font-weight: 800; color: var(--mut); background: var(--bg); border-radius: 6px; padding: 0 6px; }

/* =====================================================================
   B · 星图 Constellation — Rees as candy-coloured orbs in a night sky; glass box, a warm gradient for the one action. Dark first, light variant.
   ===================================================================== */
.dB { --bg: #0e1330; --bg2: #1c2463; --sf: rgba(28, 34, 78, .66); --sf2: rgba(255,255,255,.07); --tx: #f3f4ff; --mut: #a3a9d6; --ln: rgba(170,180,255,.22); --g1: #ffb84d; --g2: #ff6fa3; --gtx: #24102a; --glow: rgba(255,140,140,.35); --edge: rgba(170,180,255,.22); --veil: 14,19,48;
  --n1: #7cc6ff; --n2: #c4a0ff; --n3: #6ee7b7; --n4: #ff9eb5; --n5: #ffd166; --n6: #9ad1ff;
  --disp: Outfit, "PingFang SC", sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  background: radial-gradient(120% 90% at 50% -10%, var(--bg2), var(--bg) 62%); color: var(--tx); font-family: var(--disp); color-scheme: dark; }
.dB.light { --bg: #f1f3ff; --bg2: #ffffff; --sf: rgba(255,255,255,.82); --sf2: rgba(30,36,99,.05); --tx: #151a45; --mut: #5e6491; --ln: rgba(60,70,160,.16); --g1: #ff9d2e; --g2: #ff4f8b; --gtx: #ffffff; --glow: rgba(255,90,140,.22); --edge: rgba(60,70,160,.16); --veil: 241,243,255;
  --n1: #2f8bff; --n2: #8a5cf0; --n3: #12b886; --n4: #f0507a; --n5: #e9a400; --n6: #4aa3e8; color-scheme: light; }

/* =====================================================================
   C · 贴纸 Sticker — a wall of Ree stickers with question bubbles; ink outlines, hard shadows, pastel-bright blocks.
   ===================================================================== */
.dC { --ink: #1d1a33; --mut: #5a5670; --sun: #ffd84d; --coral: #ff8a6b; --mint: #5ee0a0; --sky: #7cc4ff; --grape: #b79cff; --pink: #ff9fcf;
  --disp: "Bricolage Grotesque", "PingFang SC", sans-serif; --sans: Figtree, "PingFang SC", sans-serif;
  background: #fff radial-gradient(#ececf3 1.2px, transparent 1.3px) 0 0 / 22px 22px; color: var(--ink); font-family: var(--sans); }
.dC .veil { background: radial-gradient(ellipse 52% 60% at 50% 50%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.94) 55%, rgba(255,255,255,.6) 82%, rgba(255,255,255,.2) 100%); }
.dC .wall { opacity: .7; }
.dC .h-top { background: #fff; border-bottom: 2px solid var(--ink); }
.dC .brand { display: inline-flex; align-items: center; font: 800 26px var(--disp); letter-spacing: -1px; }
.dC .brand i { display: inline-grid; place-items: center; width: 27px; height: 27px; margin-left: 2px; border-radius: 50%; background: var(--sun); border: 2px solid var(--ink); font-style: normal; font-size: 17px; line-height: 1; transition: transform .3s; }

.dC .lk:hover { text-decoration: underline wavy var(--coral); text-underline-offset: 5px; }
.dC .b1, .dC .b2 { border: 2px solid var(--ink); border-radius: 14px; padding: 6px 14px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); transition: transform .15s, box-shadow .15s; }
.dC .b1 { background: var(--sun); }
.dC .b2 { background: #fff; }
.dC .b1:hover, .dC .b2:hover { transform: translate(-1px, -2px) rotate(-1deg); box-shadow: 4px 5px 0 var(--ink); }
.dC .ib { width: 38px; height: 38px; display: grid; place-items: center; background: #fff; border: 2px solid var(--ink); border-radius: 13px; position: relative; box-shadow: 2px 2px 0 var(--ink); }
.dC .ib .dot { position: absolute; top: -5px; right: -5px; width: 13px; height: 13px; border-radius: 50%; background: var(--coral); border: 2px solid var(--ink); }
.dC .ib .cnt { position: absolute; top: -8px; right: -9px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--coral); border: 2px solid var(--ink); font: 800 10.5px/16px var(--sans); text-align: center; padding: 0 4px; }
.dC .me { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--grape); border: 2px solid var(--ink); font-weight: 800; font-size: 13px; }
.dC .st { background: var(--c); border: 2px solid var(--ink); border-radius: 20px; padding: 10px 14px 12px; box-shadow: 4px 4px 0 var(--ink); transform: rotate(var(--r)); transition: transform .2s; }
.dC .st:hover { transform: rotate(0) translateY(-3px); }
.dC .st .n { font: 800 40px/1 var(--disp); letter-spacing: -1.5px; }
.dC .st .l { font-weight: 800; font-size: 13.5px; }
.dC .st.off { --c: var(--mint); --r: -2deg; } .dC .st.sh { --c: var(--sky); --r: 1.5deg; } .dC .st.total { --c: var(--sun); --r: -1deg; }
.dC .lede { font: 800 24px/1.25 var(--disp); letter-spacing: -.5px; }
.dC .lede mark { background: var(--pink); padding: 0 6px; border-radius: 10px; border: 2px solid var(--ink); color: var(--ink); }
.dC .box { background: #fff; border: 2px solid var(--ink); border-radius: 24px; box-shadow: 6px 6px 0 var(--ink); overflow: hidden; }
.dC .box-row > svg.i { color: var(--ink); }
.dC .box-row textarea { font-family: var(--sans); font-weight: 600; font-size: 18px; }
.dC .box-row textarea::placeholder { color: #9b98ad; font-weight: 500; }
.dC .intent { font-weight: 800; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; background: var(--mint); }
.dC .intent.cmd { background: var(--sun); }
.dC .intent.unk { background: var(--pink); }
.dC .hint { color: var(--mut); font-weight: 600; }
.dC .go { background: var(--sun); border: 2px solid var(--ink); border-radius: 15px; padding: 8px 16px; font-weight: 800; font-size: 14.5px; box-shadow: 3px 3px 0 var(--ink); transition: transform .15s, box-shadow .15s; }
.dC .go:not(:disabled):hover { transform: translate(-1px, -2px); box-shadow: 4px 5px 0 var(--ink); }
.dC .drop { border-top: 2px solid var(--ink); }
.dC .drop .sec { font-weight: 800; color: var(--ink); letter-spacing: .04em; }
.dC .m small { color: var(--mut); font-weight: 500; }
.dC .tagx { font-size: 11.5px; font-weight: 800; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; background: #fff; }
.dC .tagx.off { background: var(--mint); }
.dC .act { border: 2px solid var(--ink); border-radius: 16px; background: #fff; }
.dC .act small { color: var(--mut); font-weight: 500; }
.dC .act.p { background: var(--sky); box-shadow: 3px 3px 0 var(--ink); }
.dC .act.p small { color: var(--ink); }
.dC .act:hover { transform: translate(-1px, -2px); }
.dC .sug, .dC .opt { background: #fff; border: 2px solid var(--ink); border-radius: 22px; box-shadow: 5px 5px 0 var(--ink); }
.dC .sug { background: #fffbea; }
.dC .sug-ic { border-radius: 14px; background: var(--sun); border: 2px solid var(--ink); transform: rotate(-6deg); }
.dC .sug p, .dC .fine, .dC .related, .dC .opt span { color: var(--mut); font-weight: 500; }
.dC .sug-meta .pill { border: 2px solid var(--ink); border-radius: 999px; padding: 1px 10px; background: #fff; font-weight: 700; }
.dC .sug-meta .free { background: var(--mint); }
.dC .bt1, .dC .bt2 { border: 2px solid var(--ink); border-radius: 15px; padding: 8px 16px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; box-shadow: 3px 3px 0 var(--ink); transition: transform .15s, box-shadow .15s; }
.dC .bt1 { background: var(--sun); }
.dC .bt2 { background: #fff; }
.dC .bt1:hover, .dC .bt2:hover { transform: translate(-1px, -2px); box-shadow: 4px 5px 0 var(--ink); }
.dC .opt:hover { transform: rotate(-.8deg) translateY(-2px); }
.dC .opt:first-child { background: #eef7ff; }
.dC .opt:last-child { background: #fffbea; }
.dC .opt .go-l { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.dC .chip { background: #fff; border: 2px solid var(--ink); border-radius: 999px; font-weight: 700; }
.dC .chip:nth-child(2n) { transform: rotate(1.5deg); }
.dC .chip:nth-child(3n) { transform: rotate(-1.5deg); }
.dC .chip:hover { background: var(--sun); transform: rotate(-2deg) translateY(-2px); }
.dC .h-foot { background: #fff; border: 2px solid var(--ink); border-radius: 999px; font-weight: 700; }
.dC .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--c); border: 2px solid var(--ink); font: 800 11px var(--sans); flex: none; }
.dC .wall-in { position: absolute; inset: -60px -40px; display: grid; grid-template-columns: repeat(7, minmax(170px, 1fr)); gap: 22px; padding: 0 16px; }
.dC .col { display: flex; flex-direction: column; gap: 22px; animation: up var(--dur, 140s) linear infinite; }
.dC .col.d { animation-name: down; }
.dC .sk { background: var(--c); border: 2px solid var(--ink); border-radius: 20px; padding: 12px; box-shadow: 4px 4px 0 var(--ink); transform: rotate(var(--r)); }

.dC .sk .av { background: #fff; }
.dC .sk b { font: 800 14px/1.2 var(--disp); display: block; }
.dC .sk small { font-size: 11px; font-weight: 600; display: block; }

  .dA .wall-in { grid-template-columns: repeat(2, minmax(160px, 1fr)); }

/* ---------- index page ---------- */
.ix { padding-block: 40px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ix-in { width: min(1120px, 100%); margin-inline: auto; }
.ix .ey { font: 500 11px "JetBrains Mono", monospace; letter-spacing: .15em; color: var(--page-mut); text-transform: uppercase; }
.ix h1 { font-size: 32px; font-weight: 700; letter-spacing: -.8px; margin-top: 8px; }
.ix .lede2 { font-size: 15px; color: #3d4048; max-width: 70ch; margin-top: 10px; }
.ix h2 { font-size: 19px; font-weight: 700; margin: 44px 0 14px; letter-spacing: -.3px; }
.ix .changed { margin-top: 16px; padding: 12px 16px; background: #fff; border: 1px solid var(--page-line); border-radius: 10px; font-size: 13.5px; display: grid; gap: 4px; max-width: 860px; }
.ix .changed b { font-weight: 650; }
.dirs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 26px; }
.dir { background: #fff; border: 1px solid var(--page-line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 1px solid var(--page-line); display: block; cursor: pointer; }
.thumb > .scale { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; transform: scale(var(--s, .24)); pointer-events: none; }
.thumb > .scale .h, .thumb > .scale .ex, .thumb > .scale .rp { min-height: 900px; height: 900px; overflow: hidden; }
.thumb > .scale * { animation: none !important; }
.dir-b { padding: 16px 18px 18px; display: grid; gap: 10px; }
.dir-b h3 { font-size: 17px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dir-b h3 small { font: 500 11px "JetBrains Mono", monospace; color: var(--page-mut); letter-spacing: .08em; }
.dir-b h3 .new { font: 600 10px var(--ui); color: #b4400f; background: #fff0e6; border-radius: 4px; padding: 1px 6px; }
.dir-b p { font-size: 13.5px; color: #3d4048; }
.dir-b dl { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 12.5px; }
.dir-b dt { color: var(--page-mut); }
.dir-b dd { margin: 0; min-width: 0; }
.sw { display: flex; gap: 4px; flex-wrap: wrap; }
.sw i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); display: inline-block; }
.open { margin-top: 4px; display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 13px; color: #1f4fd1; }
.rows { display: grid; gap: 8px; }
.rw { display: grid; grid-template-columns: 40px 170px minmax(0, 1fr); gap: 14px; padding: 12px 16px; background: #fff; border: 1px solid var(--page-line); border-radius: 10px; font-size: 13.5px; align-items: baseline; }
.rw .k { font: 500 12px "JetBrains Mono", monospace; color: var(--page-mut); }
.rw b { font-weight: 650; }
.rw.now { border-color: #1f4fd1; }
.rw2 { grid-template-columns: 190px minmax(0, 1fr); }
.q .rw b { color: #9a5b00; }
.flag { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: #fff7e6; border: 1px solid #f1dcae; font-size: 13.5px; color: #4a3a12; }
.flag b { font-weight: 700; }
.flag code { font: 12px "JetBrains Mono", monospace; background: #fdecc4; border-radius: 4px; padding: 0 4px; }
.intents { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.intents .c { background: #fff; border: 1px solid var(--page-line); border-radius: 12px; padding: 12px 14px; font-size: 13px; display: grid; gap: 4px; align-content: start; }
.intents .c b { font-size: 14px; }
.intents .c q { color: var(--page-mut); font-size: 12.5px; }
.intents .c a { color: #1f4fd1; font-weight: 600; font-size: 12.5px; display: inline-flex; gap: 4px; align-items: center; }

  } else {
    const loading = st === 'loading';

      <div class="lg-links"><a class="text-l" href="#explore-browse-out">${X.explore} ${I('arrow')}</a></div></div>`;

/* -------- chrome & render -------- */
function chrome() {
  const withStates = ['home', 'explore', 'ree', 'qa', 'login', 'mine'];
  const tabs = PAGES.map(([k, l]) => `<button class="rc-tab" data-go="${k}" ${k === route.page && withStates.includes(k) ? `data-state="${route.state}"` : ''} ${route.page === k ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  const pg = route.page;
  const states = !withStates.includes(pg) ? '' : `<div class="rc-row"><span class="rc-label">状态</span>${statesFor(pg).map(([k, l]) => `<button class="rc-state" data-go="${pg}" data-state="${k}" aria-pressed="${k === route.state}">${l}</button>`).join('')}<span class="rc-sep"></span><span class="rc-label">语言</span>${LANGS.map(([k, n]) => `<button class="rc-state" data-act="lang" data-lang="${k}" aria-pressed="${ui.lang === k}">${n}</button>`).join('')}<span class="rc-note">${pg === 'explore' ? 'Explore · 已按反馈修改' : pg === 'ree' ? 'Ree 页 · 已定稿' : pg === 'qa' ? '提问和回答 · 已定稿' : pg === 'login' ? '登录 / 注册 · 已定稿' : pg === 'mine' ? '我的 Ree + 任务 · 第 6 页 · 等确认' : '首页 · 已定稿'}</span></div>`;
  document.getElementById('rc').innerHTML = `<div class="rc-row"><span class="rc-brand">re0 全新改版 <small>方向 A · 我的 Ree + 任务等确认</small></span>${tabs}</div>${states}`;
}
function fitThumbs() { document.querySelectorAll('.thumb').forEach(t => t.style.setProperty('--s', t.clientWidth / 1440)); }
const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp() {
  if (reduced()) return;
  document.querySelectorAll('#app > .h .st .n').forEach(el => {
    const to = +el.dataset.n, t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(Math.round(to * e)); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

  document.documentElement.style.setProperty('--rc-h', document.getElementById('rc').offsetHeight + 'px');
  fitThumbs();
  if (route.page === 'qa' && route.state === 'cite') { const c = document.querySelector('#app .qa-b .cite'); if (c) openCite(c); }
  if (fresh && route.page === 'home') countUp();
  startPh();
}
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}
window.addEventListener('hashchange', () => { ui.editBudget = false; ui.stop = false; ui.ck = null; window.scrollTo(0, 0); render(true); });
window.addEventListener('resize', fitThumbs);
let stickTick = false;
window.addEventListener('scroll', () => {
  const el = document.getElementById('exStick');
  if (el) { const y = window.scrollY; if (y > 160) el.classList.add('stuck'); else if (y < 60) el.classList.remove('stuck'); }
  const mb = document.getElementById('mrBar');
  if (mb) { const top = document.getElementById('rc').offsetHeight, t = mb.getBoundingClientRect().top; mb.classList.toggle('stuck', t <= top + 1 && window.scrollY > 0); }
  syncReeBar();
}, { passive: true });
/* The Ree page's compact bar shows once the cover and the name row have scrolled under the top; it hides again a little before the name comes back. */
function syncReeBar() {
  const rp = document.querySelector('#app > .rp'), anchor = rp && rp.querySelector('.rp-id, .qa-q, .tk-head');
  if (!rp || !anchor) return;
  const top = document.getElementById('rc').offsetHeight, b = anchor.getBoundingClientRect().bottom;
  const bar = document.getElementById('rpBar');
  if (b < top + 4 && !rp.classList.contains('stuck')) { rp.classList.add('stuck'); bar.setAttribute('aria-hidden', 'false'); bar.querySelectorAll('[tabindex="-1"]').forEach(x => x.removeAttribute('tabindex')); }
  else if (b > top + 60 && rp.classList.contains('stuck')) { rp.classList.remove('stuck'); bar.setAttribute('aria-hidden', 'true'); bar.querySelectorAll('a, button').forEach(x => x.setAttribute('tabindex', '-1')); }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.thumb')) e.target.click(); });
function closeLang() { document.querySelectorAll('.lang.open').forEach(w => { w.classList.remove('open'); w.querySelector('.lang-btn')?.setAttribute('aria-expanded', 'false'); }); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.cite-panel')) { closeCite(); return; }
  if (e.key === 'Escape' && ui.stop) { ui.stop = false; document.querySelector('#app .dlg-shade')?.remove(); document.querySelector('#app [data-act="stopask"]')?.focus(); return; }
  if (e.key === 'Escape' && route.page === 'mine' && ['check', 'qafail', 'qaforce'].includes(route.state)) { go('mine', 'wait'); return; } if (e.key === 'Escape' && document.querySelector('.lang.open')) { const b = document.querySelector('.lang.open .lang-btn'); closeLang(); b?.focus(); } });
document.addEventListener('click', e => {
  if (!e.target.closest('.lang')) closeLang();
  if (!e.target.closest('.qa-menu')) document.querySelectorAll('.qa-menu.open').forEach(m => m.classList.remove('open'));
  const t = e.target.closest('[data-go],[data-act],a[href="#"]');
  if (!t) return;
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go, t.dataset.state); return; }
  if (t.matches('a[href="#"]')) { e.preventDefault(); return; }
  const a = t.dataset.act;
  if (a === 'theme') { ui.bLight = !ui.bLight; render(); }
  if (a === 'pause') { ui.paused = !ui.paused; render(); }
  if (a === 'toast') toast(t.dataset.msg);
  if (a === 'cite') { openCite(t); return; }
  if (a === 'citeclose') { closeCite(); return; }
  if (a === 'qamenu') { const m = t.closest('.qa-menu'); const open = !m.classList.contains('open'); m.classList.toggle('open', open); t.setAttribute('aria-expanded', String(open)); return; }
  if (a === 'qafocus' || a === 'qaat' || a === 'qaask') { const ta = document.getElementById('qafu'); if (ta) { if (a === 'qaat' && !ta.value.endsWith('@')) ta.value += (ta.value && !ta.value.endsWith(' ') ? ' ' : '') + '@'; if (a === 'qaask') ta.value = '@' + t.dataset.n + ' '; ta.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'end' }); setTimeout(() => ta.focus({ preventScroll: true }), reduced() ? 0 : 400); } else { const login = document.querySelector('#app .qa-compose.out .bt1'); login?.scrollIntoView({ block: 'center' }); login?.focus(); } return; }
  if (a === 'askfocus') { const box = document.querySelector('#app .rp-ask'); if (box) { box.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); setTimeout(() => (box.querySelector('textarea') || box.querySelector('.go'))?.focus({ preventScroll: true }), reduced() ? 0 : 450); } }
  if (a === 'stopask') { ui.stop = true; const sec = document.querySelector('#app > .tk'); if (sec && !sec.querySelector('.dlg-shade')) { sec.insertAdjacentHTML('beforeend', stopDlg(TASK_OF[route.state], ui.lang)); sec.querySelector('.dlg .bt2')?.focus(); } return; }
  if (a === 'stopclose' || (a === 'stopclose-bg' && e.target === t)) { ui.stop = false; document.querySelector('#app .dlg-shade')?.remove(); return; }
  if (a === 'ckrights') { ui.ck.rights = t.checked; rerenderDlg(); document.querySelector('#app [data-act="ckrights"]')?.focus(); return; }
  if (a === 'ckremove') { ui.ck.removed = true; rerenderDlg(); toast(ui.lang === 'en' ? 'Moved to trash. You can restore it within 30 days.' : '已移到回收站，30 天内可以恢复。'); return; }
  if (a === 'tkconfirm') { const c = document.querySelector('#app .cc:not(.ok):not(.mute)'); if (c) { c.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); setTimeout(() => c.querySelector('.cc-f button')?.focus({ preventScroll: true }), reduced() ? 0 : 450); } return; }
  if (a === 'lang') { closeLang(); switchLang(t.dataset.lang); }
  if (a === 'langmenu') { const w = t.closest('.lang'), open = !w.classList.contains('open'); closeLang(); if (open) { w.classList.add('open'); t.setAttribute('aria-expanded', 'true'); w.querySelector('[aria-checked="true"]')?.focus(); } }
  if (a === 'budget') { const el = document.getElementById('budget-in'); if (el) { const v = parseInt(el.value.replace(/\D/g, ''), 10); if (v) ui.budget = Math.min(20000, Math.max(1000, v)); } ui.editBudget = !ui.editBudget; render(); }
});
render(true);
